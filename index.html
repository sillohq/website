<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags (SEO) -->
    <title>Sillo — The batteries-included async Python framework</title>
    <meta name="title" content="Sillo — The batteries-included async Python framework" />
    <meta name="description" content="An async Python web framework where the ORM, auth, background work, websockets and HTTP layer are one product. Declare auth once — it gates the route and writes the OpenAPI spec." />
    <meta name="keywords" content="Python web framework, async Python, ASGI framework, Python API, real-time Python, batteries included framework, Python ORM, Python ASGI" />
    <meta name="author" content="Chidebele Dunamis" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="language" content="English" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sillo.build/" />
    <meta property="og:title" content="Sillo — The batteries-included async Python framework" />
    <meta property="og:description" content="An async Python web framework where the ORM, auth, background work, websockets and HTTP layer are one product, sharing one config model." />
    <!--
      Must be a raster format. Every major scraper (Twitter, LinkedIn, WhatsApp,
      Facebook, Slack, Discord) refuses SVG for og:image and falls back to no
      preview at all, which is what a brand-two.svg here did — the URL served
      fine, the format was simply never going to render.
      Dimensions are declared so a scraper can lay the card out before it has
      finished fetching the file.
    -->
    <meta property="og:image" content="https://sillo.build/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://sillo.build/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="Sillo — Batteries included. One design. A routing example showing a typed path parameter passed straight into the handler." />
    <meta property="og:site_name" content="Sillo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://sillo.build/" />
    <meta name="twitter:title" content="Sillo — The batteries-included async Python framework" />
    <meta name="twitter:description" content="An async Python web framework where the ORM, auth, background work, websockets and HTTP layer are one product, sharing one config model." />
    <meta name="twitter:image" content="https://sillo.build/og-image.jpg" />
    <meta name="twitter:image:alt" content="Sillo — Batteries included. One design. A routing example showing a typed path parameter passed straight into the handler." />
    <meta name="twitter:site" content="@sillohq" />
    <meta name="twitter:creator" content="@sillohq" />

    <!-- Mobile/App -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sillo" />
    <meta name="application-name" content="Sillo" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Links -->
    <link rel="canonical" href="https://sillo.build/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" hrefLang="en" href="https://sillo.build/" />

    <!-- Preconnect to External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="permissions-policy" content="geolocation=(), microphone=(), camera=()" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Sillo",
      "url": "https://sillo.build",
      "logo": "https://sillo.build/logo.svg",
      "description": "An async Python web framework where the ORM, auth, background work, websockets and HTTP layer are one product, sharing one config model.",
      "sameAs": [
        "https://github.com/sillohq/core",
        "https://twitter.com/sillohq"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "techwithdunamix@gmail.com"
      }
    }
    </script>

    <script type="application/ld+json">

      "@context": "https://schema.org",

      "operatingSystem": "Cross-platform",
      "url": "https://github.com/sillohq/core",

        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/app/client.tsx"></script>
  </body>
</html>
